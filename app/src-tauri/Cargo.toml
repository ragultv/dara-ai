[workspace]
members = [".", "crates/dara-mcp"]

[package]
name = "dara"
version = "0.1.0"
description = "Dara Desktop App"
authors = ["Dara Team"]
edition = "2021"

[lib]
name = "dara_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt-multi-thread"] }
dara-mcp = { path = "crates/dara-mcp" }
