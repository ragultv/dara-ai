# Builds dara.exe (Windows x64, CUDA 13.1, statically linked CUDA runtime) for every supported NVIDIA architecture, then the Dara
# desktop app's Windows installer (Dara_<version>_x64-setup.exe: the app, dara.exe and the Flash drafters; models are downloaded
# inside the app), and publishes both as a GitHub release, the way llama.cpp publishes its b<number> builds.
#   pull requests       -> build only (the zip and the installer are attached to the workflow run as artifacts)
#   push to main        -> build + release tagged b<run number>
#   manual (Actions tab) -> build, and release when "release" is ticked
name: build-release

on:
  push:
    branches: [main]
    paths: ["src/**", "tools/**", "third_party/**", "app/**", "docs/BENCHMARKING.md", ".github/workflows/build-release.yml"]
  pull_request:
    paths: ["src/**", "tools/**", "third_party/**", "app/**", "docs/BENCHMARKING.md", ".github/workflows/build-release.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (tag b<run number>)"
        type: boolean
        default: false

permissions:
  contents: write   # creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VERSION: "13.1.1"
  CUDA_ROOT: C:\cuda
  DRAFTER_TAG: flash-drafters-v2   # release whose assets are the Flash drafter files bundled into every build

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 150
    outputs:
      tag: ${{ steps.pkg.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Minimal CUDA toolkit from NVIDIA's redistributable archives (SHA-256 verified by the script), cached between runs.
      - name: Cache CUDA toolkit
        id: cuda-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CUDA_ROOT }}\${{ env.CUDA_VERSION }}
          key: cuda-redist-${{ env.CUDA_VERSION }}-${{ hashFiles('tools/install_cuda_redist.py') }}

      - name: Install CUDA toolkit
        if: steps.cuda-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python -I tools/install_cuda_redist.py --version $env:CUDA_VERSION --dest $env:CUDA_ROOT

      - name: "Build dara.exe (sm_75, sm_86, sm_89, sm_120 + PTX)"
        shell: cmd
        env:
          DARA_ARCH: all
        run: |
          set DARA_CUDA=%CUDA_ROOT%\%CUDA_VERSION%
          call tools\build_dara.bat

      - name: "Smoke test (no GPU on the runner, so argument handling only)"
        shell: pwsh
        run: |
          $out = & .\build\cuda\dara.exe 2>&1 | Out-String
          Write-Output $out
          if ($out -notmatch "usage: dara") { throw "dara.exe did not start" }
          $global:LASTEXITCODE = 0   # usage exits with 2 by design

      # dara.exe + the Flash drafters (trained offline, kept as assets of the release named in DRAFTER_TAG) + the benchmarking guide
      - name: Package
        id: pkg
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "b${{ github.run_number }}"
          $name = "dara-$tag-bin-win-cuda-$env:CUDA_VERSION-x64"
          New-Item -ItemType Directory -Force -Path "release\$name\flash" | Out-Null
          Copy-Item build\cuda\dara.exe "release\$name\"
          Copy-Item docs\BENCHMARKING.md "release\$name\"
          gh release download $env:DRAFTER_TAG --repo $env:GITHUB_REPOSITORY --pattern "*.dflash" --dir "release\$name\flash"
          foreach ($f in "drafter_4b_v2.dflash", "drafter_nano_v2.dflash") {
            if (-not (Test-Path "release\$name\flash\$f")) { throw "Flash drafter $f missing: attach it to the $env:DRAFTER_TAG release" }
          }
          @(
            "Dara $tag ($env:GITHUB_SHA)",
            "Windows x64, CUDA $env:CUDA_VERSION (runtime linked statically). GPU code for sm_75 sm_86 sm_89 sm_120 + PTX.",
            "Needs an NVIDIA GPU (Turing / GTX 16xx or newer) and a driver that supports CUDA 13 (R580 or newer).",
            "flash\drafter_4b_v2.dflash, flash\drafter_nano_v2.dflash: Flash speculative decoding for Core 4B and Nano (--flash <file> --spec 4 --flash-min-p 0.6).",
            "Usage: dara.exe --gguf <model.gguf> --chat ""Hello""   |   see BENCHMARKING.md"
          ) | Set-Content "release\$name\README.txt"
          Compress-Archive -Path "release\$name\*" -DestinationPath "release\$name.zip" -Force
          $hash = (Get-FileHash "release\$name.zip" -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\release\$name.zip.sha256", "$hash  $name.zip`n")   # LF: sha256sum -c reads it on any system
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: |
            release/${{ steps.pkg.outputs.name }}.zip
            release/${{ steps.pkg.outputs.name }}.zip.sha256

      # the engine as the installer bundles it: dara.exe and flash\*.dflash
      - name: Stage the engine for the installer
        shell: pwsh
        run: |
          $name = "${{ steps.pkg.outputs.name }}"
          New-Item -ItemType Directory -Force -Path engine-stage | Out-Null
          Copy-Item "release\$name\dara.exe" engine-stage\
          Copy-Item "release\$name\flash" engine-stage\flash -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: engine-stage
          path: engine-stage
          if-no-files-found: error

      - name: Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.pkg.outputs.tag }}"
          $name = "${{ steps.pkg.outputs.name }}"
          $notes = "Automated build of $env:GITHUB_SHA.`n`nDownload **$name.zip** (dara.exe + Flash drafters for Core 4B and Nano), unzip, and follow BENCHMARKING.md inside it. Requires an NVIDIA GPU (GTX 16xx / RTX 20xx or newer) and an NVIDIA driver with CUDA 13 support (R580+)."
          gh release create $tag "release/$name.zip" "release/$name.zip.sha256" --target $env:GITHUB_SHA --title "Dara $tag" --notes $notes

  # The desktop app's installer. Needs the engine from the job above; the app itself is built here (Node + Rust).
  installer:
    needs: windows-cuda
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: engine-stage
          path: app/src-tauri/resources/engine

      - name: Check the engine is in place
        shell: pwsh
        run: |
          foreach ($f in "dara.exe", "flash\drafter_4b_v2.dflash", "flash\drafter_nano_v2.dflash") {
            if (-not (Test-Path "app\src-tauri\resources\engine\$f")) { throw "$f missing from the staged engine" }
          }

      - name: Install, test and build the app
        shell: pwsh
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          pnpm exec vitest run
          pnpm run tauri build

      - name: Name the installer and hash it
        id: setup
        shell: pwsh
        run: |
          $exe = Get-ChildItem app\src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer was built" }
          "{0:N1} MB  {1}" -f ($exe.Length / 1MB), $exe.Name
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($exe.FullName).sha256", "$hash  $($exe.Name)`n")
          "exe=$($exe.FullName)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: dara-installer
          path: |
            ${{ steps.setup.outputs.exe }}
            ${{ steps.setup.outputs.exe }}.sha256

      - name: Add the installer to the release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ needs.windows-cuda.outputs.tag }}" "${{ steps.setup.outputs.exe }}" "${{ steps.setup.outputs.exe }}.sha256" --clobber
